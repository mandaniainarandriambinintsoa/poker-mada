# Configuration Render.com
# https://render.com/docs/blueprint-spec

services:
  # Backend API + Socket.io
  - type: web
    name: poker-mada-api
    env: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: node dist/app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: poker-mada-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: poker-mada-api
      - key: JWT_AUDIENCE
        value: poker-mada-web
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: ALLOW_LOCAL_REGISTRATION
        value: false
      - key: CLIENT_URL
        sync: false

databases:
  - name: poker-mada-db
    plan: free
    databaseName: poker_mada
    user: poker_user
